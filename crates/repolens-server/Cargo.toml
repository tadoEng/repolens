[package]
name = "repolens-server"
description = "RepoLens HTTP API, durable worker, and migration runner."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Three binaries, one container image: Cloud Run overrides the entrypoint per
# resource, so the Service and the Job share a single build and a single
# Artifact Registry repository.
[[bin]]
name = "server"
path = "src/bin/server.rs"

[[bin]]
name = "worker"
path = "src/bin/worker.rs"

[[bin]]
name = "migrate"
path = "src/bin/migrate.rs"

[dependencies]
repolens-core = { workspace = true }
repolens-github = { workspace = true }

axum = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }

flate2 = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tar = { workspace = true }
tempfile = { workspace = true }
time = { workspace = true }
tokei = { workspace = true }
uuid = { workspace = true }

dotenvy = { workspace = true }

utoipa = { workspace = true }
utoipa-axum = { workspace = true }

sqlx = { workspace = true }

# Fetching Google's signing keys, and verifying against them.
reqwest = { workspace = true }
jsonwebtoken = { workspace = true }

tracing = { workspace = true }
tracing-subscriber = { workspace = true }

thiserror = { workspace = true }
anyhow = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
# Generates the RSA keypair `tests/authentication.rs` signs test tokens with.
#
# Generated per run rather than committed: `.gitignore` blocks `*.pem` and
# `*.key` on purpose, and carving an exception for a fixture would weaken a net
# that exists to catch the real thing. A key that is never written to disk
# cannot be mistaken for a credential by a scanner, a reviewer, or a future
# copy-paste.
# Hostile archive paths are generated rather than listed. A hand-written set of
# traversal cases pins the ones somebody thought of, which is the set an
# attacker is least interested in.
proptest = "1"
rsa = "0.9"
rand = "0.8"
# Serves a key set `tests/signing_keys.rs` controls, so request counts and key
# rotation are observed rather than reasoned about.
wiremock = "0.6"
# Encodes the RSA modulus and exponent into the JWK form the verifier parses.
base64 = "0.22"
