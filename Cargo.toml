[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
# All rights reserved, matching `"license": "UNLICENSED"` in package.json and the
# LICENSE file. The repository is public so the work can be read and reviewed;
# that is not the same as granting rights to use it, and a public repository with
# no licence grant defaults to exactly this position anyway.
#
# This crate previously declared `MIT OR Apache-2.0` while package.json declared
# UNLICENSED — two incompatible legal positions in one repository. Aligning on the
# restrictive one is the reversible direction: opening the licence later is a
# deliberate act, whereas retracting a grant already published is not.
license = "LicenseRef-Proprietary"
publish = false
repository = "https://github.com/tadoEng/repolens"

# Version policy (plan Part 4): normal compatible requirements, not blanket exact
# pins. Build reproducibility comes from Cargo.lock, rust-toolchain.toml, and the
# container base-image digest. Exact pins are reserved for the small set of things
# that change deterministic report output — Tokei, analyzer version, ruleset
# version, exclusion-policy version, GitHub REST API version — none of which are
# ordinary Cargo dependencies at this stage.
#
# Dependencies arrive with the stage that needs them, never "for later".
# `reqwest` came with ingestion (#4) and `jsonwebtoken` with authenticated
# creation (#13). `tar` and `flate2` arrive here with archive extraction (#12);
# `tokei` follows with the counting half of it. `google-cloud-auth` is still
# absent, because verifying a Firebase ID token needs only Google's *public*
# signing keys and the project id, not a service-account credential.
[workspace.dependencies]
repolens-core = { path = "crates/repolens-core" }
repolens-github = { path = "crates/repolens-github" }

axum = { version = "0.8", features = ["macros"] }
tokio = { version = "~1.51", features = [
  "macros",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = [
  "catch-panic",
  "cors",
  "limit",
  "request-id",
  "timeout",
  "trace",
] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Archive extraction for composition (#12).
#
# `flate2` stays on its default `miniz_oxide` backend — pure Rust, so the
# container needs no C toolchain and the build has one less thing that can
# differ between a developer's machine and the deployed image.
#
# `tar` is used through `Archive::entries()` and never `unpack()`: that one
# call writes whatever the tarball says, which is the control every check in
# `infrastructure::composition` exists to impose.
flate2 = "1"
tar = "0.4"

# Pinned exactly, unlike every other dependency here.
#
# The version policy above reserves exact pins for the handful of things that
# change deterministic report output, and names Tokei as one. It is not a
# library we call for convenience: its language detection *is* the definition of
# what counts as Rust, and a minor release that reclassifies one extension
# silently changes every report. The version is persisted in the result so two
# reports that disagree can say why.
#
# `default-features = false` drops the `cli` feature, which exists to build the
# `tokei` binary. Issue #12 requires the counter to be a library call and never
# `Command::new("tokei")`, so the binary and its argument parser are weight the
# container does not need.
tokei = { version = "=14.0.0", default-features = false }

# RAII temporary directories. The cleanup guarantee is the point: `TempDir`
# removes its tree on drop, and drop runs while unwinding, so a panic mid-count
# does not leave an extracted repository behind on a memory-backed volume.
tempfile = "3"

# Loads .env.local for local runs so a developer does not have to remember to
# source it before every `cargo run`. In a deployed environment no such file
# exists and the call is a no-op — the platform supplies the variables.
dotenvy = "0.15"

utoipa = { version = "5.5", features = ["axum_extras", "time", "uuid"] }
utoipa-axum = "0.2"

sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls-ring-native-roots",
  "postgres",
  "macros",
  "migrate",
  "uuid",
  "time",
  "json",
] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

thiserror = "2"
anyhow = "1"

# v7 for entity ids: time-ordered for index locality, 74 random bits so an id in
# a URL stays unguessable. v5 for *derived* ids -- a finding's id is a function of
# its rule, so two analyses of one commit produce byte-identical reports, which a
# random id would break for no gain.
uuid = { version = "1", features = ["v5", "v7", "serde"] }
time = { version = "0.3", features = ["serde"] }

# --- Ingestion stage (issue #4). Added ahead of use so the workspace manifest is
# --- edited once rather than by two concurrent workstreams.
# `rustls`, not `rustls-tls`: reqwest renamed the feature in 0.13, and cargo
# unions features across the workspace, so a wrong name here cannot be
# subtracted by a member crate.
#
# `json` is deliberately absent. Every response body is read through an explicit
# size cap and parsed from the resulting slice, so `Response::json()` — which
# reads an unbounded body before deserializing — would be the one path around
# the byte budget that the ingestion boundary exists to enforce.
reqwest = { version = "0.13", default-features = false, features = [
  "rustls",
  "http2",
  "stream",
  "gzip",
] }
url = "2"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
sha2 = "0.10"
hex = "0.4"
secrecy = "0.10"

# Firebase ID token verification (#13). RS256 only: Google signs ID tokens with
# rotating RSA keys published as JWKs, so no key material and no service-account
# credential live in this repository — the public project id is the whole
# server-side configuration.
# `rust_crypto` rather than `aws_lc_rs`: a pure-Rust provider needs no C
# toolchain, which keeps the container build and the Windows developer build
# identical. jsonwebtoken 10 requires exactly one provider to be selected and
# panics at first use if none is.
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
