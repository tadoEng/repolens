name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Warnings fail the build. A warning nobody has to fix is a warning everybody
  # learns to scroll past.
  RUSTFLAGS: -D warnings

jobs:
  agent-contract:
    name: Agent contract
    runs-on: ubuntu-latest

    # Reads Markdown, JSON, and this file. No secrets, no services, no network,
    # and it never executes a command it finds in a code block — the point is to
    # prove the instructions describe the repository, not to become a second
    # verification pipeline. Everything below still proves the commands.
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Validator tests
        # The guard is only worth its CI minute if it can fail, so its own
        # fixture trees run first.
        run: node --test "scripts/*.test.mjs"

      - name: Validate the instruction set
        run: node scripts/check-agent-contracts.mjs

  rust:
    name: Rust workspace
    runs-on: ubuntu-latest

    # PostgreSQL arrives here with the first tests that need it,
    # `tests/postgres.rs`, exactly as the previous note said it would. Those
    # tests panic when DATABASE_URL is unset rather than skipping, so this
    # service is not an optimisation — without it the job fails, which is the
    # point: a suite that can quietly vanish is a coverage claim nobody checks.
    #
    # Pinned to the major version Neon runs. An ephemeral container is the right
    # target for CI even though production is Neon: these assert SQL behaviour,
    # not the hosting, and pointing CI at a shared database would make runs
    # interfere with each other and leak a credential into every log.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: repolens
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Both point at the same container. The split exists because Neon
      # separates a pooled endpoint from a direct one; a local PostgreSQL has
      # no such distinction, and inventing one here would test a fiction.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/repolens
      DATABASE_DIRECT_URL: postgres://postgres:postgres@localhost:5432/repolens

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install the pinned toolchain
        # rust-toolchain.toml decides the version and components; naming them
        # again here would create a second source of truth that can disagree.
        run: rustup show active-toolchain || rustup toolchain install

      - name: Report toolchain
        run: |
          rustc --version
          cargo --version
          cargo clippy --version
          cargo fmt --version

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --workspace --all-targets

      - name: Build
        run: cargo build --workspace --locked

      - name: Apply migrations
        # The same binary a deployment runs, against the same schema. A test
        # fixture that built the tables itself would be a second definition of
        # the schema, free to drift from migrations/ and certain to.
        run: cargo run --bin migrate

      - name: Test
        run: cargo test --workspace --locked

      - name: Assert the committed contract is not stale
        # `cargo test` already runs the staleness gate, but only inside the test
        # process. This asserts the working tree too: a contributor who
        # regenerated contracts/openapi.json and forgot to commit it would
        # otherwise pass CI while the frontend built against a document nobody
        # else has.
        run: |
          set -euo pipefail
          if ! git diff --quiet -- contracts/openapi.json; then
            echo "::error::contracts/openapi.json differs from the committed copy"
            git diff -- contracts/openapi.json
            exit 1
          fi
          echo "contract document matches the routes"

  frontend:
    name: Frontend workspace
    runs-on: ubuntu-latest

    # Gated on the agent contract because both browser suites cost minutes and
    # the guard costs seconds. A stale instruction file is worth catching before
    # two Playwright installs, not after them.
    needs: agent-contract

    env:
      # Explicit rather than inherited. The production build fails closed without
      # this, by design — see web/svelte.config.js. CI is testing that the build
      # works, not what origin it points at, so a localhost value is the honest
      # choice and setting it here records that decision instead of hiding it
      # behind a default.
      PUBLIC_API_ORIGIN: http://localhost:8080

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          # engines.node in package.json is the single source of truth for the
          # major version; this reads the version file rather than restating it.
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Types
        run: pnpm -r check

      - name: Lint and format
        # web's `lint` is `prettier --check . && eslint .`, so formatting is
        # already enforced here rather than in a second step that could drift.
        run: pnpm -r lint

      - name: Install Playwright browsers
        # Must precede the unit tests, not just the e2e ones: web's Vitest suite
        # runs in *browser mode* rather than jsdom, so it launches Chromium too.
        # `chromium` and the headless shell are separate downloads, and browser
        # mode uses the shell — installing only `chromium` fails at run time with
        # a missing chrome-headless-shell binary.
        run: pnpm --filter @repolens/web exec playwright install --with-deps chromium chromium-headless-shell

      - name: Unit and contract tests
        # Includes the generated-schema staleness gate: if src/schema.ts drifts
        # from contracts/openapi.json, this is where it fails.
        run: pnpm -r test

      - name: Build
        run: pnpm -r build

      - name: Assert the build output is static
        # adapter-static must not emit a server bundle. If one appears, the app
        # has silently acquired an SSR dependency and can no longer be hosted on
        # Cloudflare static assets — the core hosting assumption of the project.
        run: |
          set -euo pipefail
          for forbidden in index.js handler.js server.js manifest.js; do
            if find web/build -name "$forbidden" -print -quit | grep -q .; then
              echo "::error::web/build contains $forbidden — output is no longer static"
              exit 1
            fi
          done
          echo "static output confirmed: $(find web/build -type f | wc -l) files"

      - name: Scan the production bundle for secrets
        # Acceptance criterion of issue #8. The bundle is what actually ships, so
        # it is the last place a server-side credential can hide before a browser
        # receives it.
        #
        # The question this asks is deliberately narrow: "is this a value that
        # grants access, which a browser must never hold?" Not "does this look
        # like a key?"
        #
        # NOT scanned: the Firebase browser API key (`AIzaSy…`). It identifies the
        # project rather than authorizing access, and Firebase documents it as
        # intended for client code — the repository itself declares it as
        # PUBLIC_FIREBASE_API_KEY in .env.example. A rule forbidding it from the
        # bundle would contradict the architecture and fail this job the day
        # Firebase auth lands (#13), training everyone to ignore the scan. That
        # key is protected by API restrictions in the provider console, which is
        # where a key that is *supposed* to be public gets constrained.
        run: |
          set -euo pipefail

          patterns=(
            # Database URLs carrying an inline password, and Neon role secrets.
            'postgres(ql)?://[^[:space:]]*:[^[:space:]]*@'
            'npg_[A-Za-z0-9]{16,}'
            # GitHub tokens: personal, OAuth, server-to-server, user-to-server.
            'gh[pousr]_[A-Za-z0-9]{36}'
            'github_pat_[A-Za-z0-9_]{50,}'
            # Asymmetric private keys in any PEM form.
            'BEGIN [A-Z ]*PRIVATE KEY'
            # Google service-account JSON, by its two unmistakable fields.
            '"type"[[:space:]]*:[[:space:]]*"service_account"'
            '"private_key_id"[[:space:]]*:'
            # Google OAuth client secret (server-side; never belongs in a browser).
            'GOCSPX-[A-Za-z0-9_-]{20,}'
            # Legacy FCM server key — grants send-to-any-device and is server-only.
            'AAAA[A-Za-z0-9_-]{7}:APA91b[A-Za-z0-9_-]{100,}'
          )

          found=0
          for pattern in "${patterns[@]}"; do
            if matches=$(grep -rIlE "$pattern" web/build/); then
              echo "::error::server-side credential pattern in production bundle: $pattern"
              echo "$matches"
              found=1
            fi
          done

          [ "$found" -eq 0 ] || exit 1
          echo "bundle scan clean: ${#patterns[@]} patterns, no match"

      - name: Assert the visual baselines exist for this platform
        # `visual.spec.ts` skips when the running platform has no baseline, which
        # is right for a developer on a machine CI never uses — but on the
        # merge-gating platform a skip means the visual assertions protect
        # nothing while reporting green. This turns that silence into a failure.
        run: |
          set -euo pipefail
          missing=0
          for name in report-completed-chromium-linux.png                       report-completed-narrow-mobile-360-linux.png                       progress-failed-retriable-chromium-linux.png                       report-loc-unavailable-chromium-linux.png; do
            if [ ! -f "web/e2e/visual.spec.ts-snapshots/$name" ]; then
              echo "::error::missing Linux visual baseline: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Capture them with the 'Visual baselines' workflow, review the artefact, and commit it."
            exit 1
          fi
          echo "all four Linux baselines present"

      - name: Browser and accessibility tests
        # Includes the axe WCAG 2.1 AA scans across all three routes at
        # 360/768/1280px — the accessibility contract is a gate, not a review step.
        run: pnpm --filter @repolens/web run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  integration:
    name: Browser against a real API
    runs-on: ubuntu-latest

    needs: agent-contract

    # The only job where a browser talks to a real Axum server. Every other
    # browser test mocks the probe, which proves how a response renders but not
    # that it is reachable: a mocked request never leaves the page, so it never
    # consults the CSP connect-src allowlist and never triggers an origin
    # comparison. Those fail only after deploy, which is what this catches.
    #
    # Needs no database and no secret — the server is started with an empty
    # DATABASE_URL, so it runs on a fork.
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the server
        # Built ahead of Playwright so a cold compile does not eat the
        # webServer startup budget and surface as a misleading timeout.
        run: cargo build --bin server --locked

      - name: Install Playwright browsers
        run: pnpm --filter @repolens/web exec playwright install --with-deps chromium chromium-headless-shell

      - name: Browser against a real Axum server
        run: pnpm --filter @repolens/web run test:e2e:integration

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-report
          path: web/playwright-report/
          retention-days: 7
