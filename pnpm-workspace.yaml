# RepoLens pnpm workspace.
#
# Layout is fixed by the frontend plan (§4.2):
#   web/                          SvelteKit app (adapter-static, no Node server)
#   packages/repolens-api-client  generated OpenAPI schema + thin openapi-fetch wrapper
#   packages/repolens-msw         shared MSW handlers + executable fixtures
#
# No package is added speculatively. A new workspace package needs a real second
# consumer before it exists.
packages:
  - web
  - packages/*

# pnpm refuses to run a dependency's install-time lifecycle scripts unless it is listed
# here. Every entry is a decision to let third-party code execute on this machine, so each
# one is justified explicitly rather than blanket-approved.
allowBuilds:
  # msw's postinstall only prints guidance about `msw init`, which writes the browser
  # service worker into a public directory. We invoke that explicitly when browser mocking
  # is wired up (issue #14), so the script has nothing to do here.
  msw: false
  # Arrived with `firebase` (#13). Its postinstall only patches its own package for
  # bundlers that need CommonJS interop; Vite consumes the ESM build, so there is nothing
  # for it to do and a third-party install script is not worth running for nothing.
  '@firebase/util': false
  # A transitive dependency of Firebase modules this app never imports — Firestore and
  # the AI SDK. Its postinstall generates CLI helpers for code generation we do not
  # perform, so it is denied rather than allowed "just in case".
  protobufjs: false

# Peer mismatches fail the install. A blanket escape hatch would also silence the
# next mismatch — the one that actually matters — so each exception below is named
# individually and has to say which package and which version it forgives.
#
# Lives here rather than in .npmrc because npm reads .npmrc too and warns on every
# invocation that `strict-peer-dependencies` is an unknown config; pnpm 11 moved
# its settings here regardless.
strictPeerDependencies: true

peerDependencyRules:
  allowedVersions:
    # openapi-typescript 7.13.0 declares a peer of typescript@^5 while the workspace
    # pins 6.x. It is a codegen CLI that ships its own types and never participates in
    # our type-checking, and its output is verified by schema.test.ts, so the mismatch
    # cannot affect correctness. Remove this once it supports TypeScript 6.
    openapi-typescript>typescript: '6'
